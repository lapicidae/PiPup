<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PiPup WHEP Player</title>
    <style>
        body, video { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
        video { object-fit: cover; display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline muted></video>
    <script>
        const video = document.getElementById('v');
        const stream = new MediaStream();
        video.srcObject = stream;

        let pc = null;

        async function start() {
            const urlParams = new URLSearchParams(window.location.search);
            const streamUrl = urlParams.get('url');
            if (!streamUrl) return;

            const startTime = Date.now();
            let lastError = null;

            for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                    console.log(`WHEP: Connection attempt ${attempt}/3 to ${streamUrl}`);

                    if (pc) {
                        pc.close();
                        pc = null;
                    }

                    // Clear existing tracks from the stream if any
                    stream.getTracks().forEach(track => {
                        stream.removeTrack(track);
                        track.stop();
                    });

                    const hostname = new URL(streamUrl).hostname;
                    // Improved local detection (IPv4 private, IPv6 local, .local domains, localhost)
                    const isLocal = /^(192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.|127\.|localhost|10\.0\.2\.2|\[?fe80:)/i.test(hostname) || hostname.endsWith('.local');

                    console.log('WHEP: ' + (isLocal ? 'Local' : 'Remote') + ' connection detected for ' + hostname);

                    const config = {
                        iceServers: isLocal ? [] : [{ urls: 'stun:stun.l.google.com:19302' }],
                        iceTransportPolicy: 'all',
                        bundlePolicy: 'max-bundle',
                        iceCandidatePoolSize: 1 // Pre-warm ICE engine
                    };

                    pc = new RTCPeerConnection(config);

                    pc.oniceconnectionstatechange = () => {
                        console.log(`WHEP: [${Date.now() - startTime}ms] ICE Connection State: ${pc.iceConnectionState}`);
                        if (pc.iceConnectionState === 'failed' && attempt === 3) {
                            if (window.PiPup) window.PiPup.onMediaError('WebRTC ICE Connection Failed');
                        }
                    };

                    pc.onicegatheringstatechange = () => {
                        console.log(`WHEP: [${Date.now() - startTime}ms] ICE Gathering State: ${pc.iceGatheringState}`);
                    };

                    pc.onsignalingstatechange = () => {
                        console.log(`WHEP: [${Date.now() - startTime}ms] Signaling State: ${pc.signalingState}`);
                    };

                    video.onplaying = () => {
                        const elapsed = Date.now() - startTime;
                        console.log('WHEP: Video playing after ' + elapsed + 'ms');
                        if (window.PiPup) window.PiPup.onMediaPlaying();
                    };

                    pc.ontrack = (e) => {
                        console.log('WHEP: Received remote track: ' + e.track.kind);
                        if (e.track.kind === 'video') {
                            stream.addTrack(e.track);
                            video.play().catch(err => console.error('WHEP: Play failed', err));
                        }
                    };

                    if (pc.addTransceiver) {
                        pc.addTransceiver('video', { direction: 'recvonly' });
                    }

                    const offerOptions = pc.addTransceiver ? {} : { offerToReceiveVideo: true };
                    const offer = await pc.createOffer(offerOptions);
                    await pc.setLocalDescription(offer);

                    // Wait for initial ICE candidates (Non-trickle WHEP)
                    await new Promise(resolve => {
                        if (pc.iceGatheringState === 'complete') {
                            resolve();
                        } else {
                            const checkState = () => {
                                // Resolve if we have at least one candidate (faster on local networks)
                                if (pc.iceGatheringState === 'complete' || pc.localDescription.sdp.includes('a=candidate')) {
                                    pc.removeEventListener('icegatheringstatechange', checkState);
                                    resolve();
                                }
                            };
                            pc.addEventListener('icegatheringstatechange', checkState);
                            // Hard timeout after 1.0 seconds to avoid hanging
                            setTimeout(resolve, 1000);
                        }
                    });

                    console.log(`WHEP: [${Date.now() - startTime}ms] Fetching SDP answer...`);
                    const response = await fetch(streamUrl, {
                        method: 'POST',
                        body: pc.localDescription.sdp,
                        headers: { 'Content-Type': 'application/sdp' }
                    });

                    if (!response.ok) {
                        const errorText = await response.text().catch(() => '');
                        throw new Error('HTTP error ' + response.status + (errorText ? ': ' + errorText.substring(0, 100) : ''));
                    }

                    const answerSdpRaw = await response.text();
                    if (!answerSdpRaw.trim()) {
                        throw new Error('No SDP answer: Received empty response from server.');
                    }

                    if (answerSdpRaw.trim().startsWith('<')) {
                        throw new Error('No SDP answer: Received HTML instead of WebRTC stream.');
                    }

                    // Strip a=end-of-candidates as it causes parsing errors in some WebView versions
                    const answerSdp = answerSdpRaw.replace(/a=end-of-candidates\s?\r?\n?/g, "");

                    if (!answerSdp.trim().startsWith('v=')) {
                        throw new Error('No SDP answer: Response does not start with v=0');
                    }

                    console.log(`WHEP: [${Date.now() - startTime}ms] Setting remote description...`);
                    await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
                    console.log(`WHEP: [${Date.now() - startTime}ms] Setup complete, waiting for tracks...`);

                    return; // Success, exit the loop
                } catch (e) {
                    lastError = e;
                    console.warn(`WHEP: Attempt ${attempt} failed: ${e.message}`);
                    if (attempt < 3) {
                        await new Promise(r => setTimeout(r, 500)); // Short delay for local networks
                    }
                }
            }

            // If we reached here, all attempts failed
            console.error('WHEP Error: All connection attempts failed.', lastError);
            if (window.PiPup) window.PiPup.onMediaError(lastError ? lastError.message : 'Connection failed after 3 attempts');
        }

        // Cleanup function for explicitly closing connection
        window.addEventListener('unload', () => {
            if (pc) {
                console.log('WHEP: Closing RTCPeerConnection');
                pc.close();
                pc = null;
            }
        });

        start();
    </script>
</body>
</html>
