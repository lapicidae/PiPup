<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PiPup WHEP Player</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        video { object-fit: cover; display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline muted></video>
    <script>
        const video = document.getElementById('v');
        const stream = new MediaStream();
        video.srcObject = stream;

        let pc = null;

        async function start() {
            // Give the DOM a tiny bit of time to settle before starting WebRTC
            await new Promise(r => setTimeout(r, 50));

            // URL injection placeholder (MediaRenderer targets this)
            const streamUrl = '{{STREAM_URL}}';
            if (!streamUrl || streamUrl.startsWith('{{')) {
                const urlParams = new URLSearchParams(window.location.search);
                const url = urlParams.get('url');
                if (!url) return;
                run(url);
            } else {
                run(streamUrl);
            }
        }

        async function run(streamUrl) {
            const startTime = Date.now();
            let lastError = null;

            for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                    console.log(`WHEP: Connection attempt ${attempt}/3 to ${streamUrl}`);

                    if (pc) {
                        pc.close();
                        pc = null;
                    }

                    // Clear existing tracks from the stream if any
                    stream.getTracks().forEach(track => {
                        stream.removeTrack(track);
                        track.stop();
                    });

                    const hostname = new URL(streamUrl).hostname;
                    const isLocal = /^(192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.|127\.|localhost|10\.0\.2\.2|\[?fe80:)/i.test(hostname) || hostname.endsWith('.local');

                    const config = {
                        iceServers: isLocal ? [] : [{ urls: 'stun:stun.l.google.com:19302' }],
                        iceTransportPolicy: 'all',
                        bundlePolicy: 'max-bundle',
                        iceCandidatePoolSize: 1
                    };

                    pc = new RTCPeerConnection(config);

                    pc.oniceconnectionstatechange = () => {
                        console.log(`WHEP: [${Date.now() - startTime}ms] ICE Connection State: ${pc.iceConnectionState}`);
                        if (pc.iceConnectionState === 'failed' && attempt === 3) {
                            if (window.PiPup) window.PiPup.onMediaError('WebRTC ICE Connection Failed');
                        }
                    };

                    video.onplaying = () => {
                        console.log('WHEP: Video playing after ' + (Date.now() - startTime) + 'ms');
                        if (window.PiPup) window.PiPup.onMediaPlaying();
                    };

                    pc.ontrack = (e) => {
                        console.log('WHEP: Received remote track: ' + e.track.kind);
                        if (e.track.kind === 'video') {
                            stream.addTrack(e.track);
                            video.play().catch(err => console.error('WHEP: Play failed', err));
                        }
                    };

                    if (pc.addTransceiver) {
                        pc.addTransceiver('video', { direction: 'recvonly' });
                    }

                    const offer = await pc.createOffer(pc.addTransceiver ? {} : { offerToReceiveVideo: true });
                    await pc.setLocalDescription(offer);

                    await new Promise(resolve => {
                        if (pc.iceGatheringState === 'complete') resolve();
                        else {
                            const checkState = () => {
                                if (pc.iceGatheringState === 'complete' || pc.localDescription.sdp.includes('a=candidate')) {
                                    pc.removeEventListener('icegatheringstatechange', checkState);
                                    resolve();
                                }
                            };
                            pc.addEventListener('icegatheringstatechange', checkState);
                            setTimeout(resolve, 1000);
                        }
                    });

                    const response = await fetch(streamUrl, {
                        method: 'POST',
                        body: pc.localDescription.sdp,
                        headers: { 'Content-Type': 'application/sdp' }
                    });

                    if (!response.ok) throw new Error('HTTP error ' + response.status);

                    const answerSdpRaw = await response.text();
                    if (!answerSdpRaw.trim() || answerSdpRaw.trim().startsWith('<')) throw new Error('Invalid SDP answer');

                    const answerSdp = answerSdpRaw.replace(/a=end-of-candidates\s?\r?\n?/g, "");
                    await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
                    return;
                } catch (e) {
                    lastError = e;
                    console.warn(`WHEP: Attempt ${attempt} failed: ${e.message}`);
                    if (attempt < 3) await new Promise(r => setTimeout(r, 500));
                }
            }

            if (window.PiPup) window.PiPup.onMediaError(lastError ? lastError.message : 'Connection failed');
        }

        window.addEventListener('unload', () => { if (pc) { pc.close(); pc = null; } });
        start();
    </script>
</body>
</html>
